<body>
  <div class="grain" aria-hidden="true"></div>

  <header class="nav">

      <a href="#explore">Exploration</a>

      </div>

      <div class="hero-content">
        <p class="eyebrow reveal" data-site="name">Navneet Singh</p>
        <h1 class="hero-name" id="hero-name"><span class="hi">Hi, I'm a</span> <span class="cube-wrap"><span class="cube" id="role-cube"></span></span></h1>

        <p class="hero-tagline reveal" data-site="tagline"></p>
        <div class="hero-actions reveal">
          <a class="btn btn-primary" href="#games">View my games <span class="arrow">→</span></a>
          <button class="btn btn-ghost" id="reel-btn" type="button"><span class="play" aria-hidden="true"></span> Watch showreel</button>

      </div>

      <a class="scroll-cue" href="#about" aria-label="Scroll down"><span></span></a>

    <section id="about" class="section about">
      <div class="about-grid">
        <div class="reveal">
          <p class="eyebrow">Hello, I'm Navneet</p>
          <p class="about-intro" data-site="intro"></p>
        </div>
      </div>

    <section id="games" class="section">
      <header class="section-head reveal">
        <p class="eyebrow">01 · Play</p>

    <section id="explore" class="section">

        <p class="section-sub">Design pitches, experiments and art.</p>

      <div class="explore-grid" id="explore-grid"></div>
    </section>

    <section id="contact" class="section contact">
      <header class="section-head reveal">
        <p class="eyebrow">03 · Say hi</p>
        <h2 class="section-title">Let's build something</h2>
        <span class="rule" aria-hidden="true"></span>

      <div class="contact-links" id="contact-links"></div>
    </section>

  <footer class="footer">
    <p>© <span id="year"></span> <span data-site="name"></span></p>
  </footer>

  <div class="modal" id="reel-modal" hidden>
